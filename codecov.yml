# The required-checks fan-in verifies selected jobs/uploads before notifying.
# A fixed upload count is incorrect for partial runs and retries.
codecov:
    notify:
        manual_trigger: true
coverage:
    status:
        project:
            default:
                target: auto
        patch:
            default:
                target: auto
comment:
    show_carryforward_flags: true
    layout: 'reach,diff,flags,components,files'
component_management:
    default_rules:
        statuses:
            - type: project
              target: auto
              informational: true
    individual_components:
        - component_id: rust-engine
          name: Rust engine
          paths:
              - 'crates/webfont-generator/src/(?!main\.rs$|manifest\.rs$).*'
        - component_id: rust-cli
          name: Rust CLI
          paths:
              - 'crates/webfont-generator/src/main.rs'
              - 'crates/webfont-generator/src/manifest.rs'
        - component_id: node-adapter
          name: Node adapter
          paths:
              - 'packages/webfont-generator/native/**'
              - 'packages/webfont-generator/index.js'
              - 'packages/webfont-generator/validations.js'
              - 'packages/webfont-generator/templates.js'
        - component_id: vite-plugin
          name: Vite plugin
          paths:
              - 'packages/vite-svg-2-webfont/src/**'
        - component_id: scripts
          name: Repository scripts
          paths:
              - 'scripts/**'
ignore:
    - '.pnpm/**'
    - '**/tests/**'
    - '**/tests.rs'
    - '**/*_tests.rs'
    - '**/*.test.*'
    - '**/*.test-d.ts'
    - '**/test_helpers.rs'
    - '**/fixtures/**'
    - '**/benches/**'
    - '**/bench_support.rs'
    - 'packages/webfont-generator/binding.*'
    - 'packages/docs/**'
    - 'packages/example/**'
flags:
    script-tests:
        carryforward: true
    rust-tests:
        carryforward: true
    cli-tests:
        carryforward: true
    napi-vitest-rust:
        carryforward: true
    napi-vitest-js:
        carryforward: true
    plugin-tests:
        carryforward: true
