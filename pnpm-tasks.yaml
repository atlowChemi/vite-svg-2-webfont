# Authoritative task graph for development and CI: pnpm pipeline NAME --full.
# Root-owned tasks cover workspace inputs that package-local ../../ globs cannot hash.
pipelines:
    native: [native]
    check: [fmt:rust, adapter:check, browser:check]
    rust-check: [fmt:rust, adapter:check]
    browser-check: [fmt:rust, browser:check]
    test: [test:js]
    rust-test: [fmt:rust, adapter:test]
    browser-test: [fmt:rust, browser:test]
    build: [plugin:pack, browser:pack]
    plugin-build: [plugin:pack]
    browser-build: [browser:pack]
    docs: [docs]
    example: [example]
    coverage: [coverage]
    assets: [docs:social]
    compat: [test:compat]
    scripts-coverage: [coverage:scripts]
    bench: [bench:vitest, fmt:rust]
    engine-bench: [engine:bench]
    engine-coverage: [engine:coverage]
    cli-coverage: [engine:coverage:cli]
    doctests: [engine:doctests]
    engine-color-proof: [engine:color-proof]
    adapter-browser: [adapter:browser]
    adapter-color-proof: [adapter:color-proof]
    adapter-coverage: [adapter:coverage]
    native-coverage: [adapter:coverage:native]
    binding-regenerate: [adapter:binding:regenerate]
    adapter-bench: [adapter:bench]
    native-release: [native:release, fmt:rust]
    browser-tarball: [browser:tgz]
    browser-coverage: [browser:coverage]
    browser-publish: [browser:publish]
    plugin-dev: [plugin:dev]
    plugin-tarball: [plugin:tgz]
    plugin-test: [plugin:test]
    plugin-browser: [plugin:browser]
    fixtures-refresh: [plugin:fixtures]
    plugin-publish: [plugin:publish]
    example-dev: [example:dev]
    example-preview: [example:preview]
    docs-dev: [docs:dev]
    docs-preview: [docs:preview]
tasks:
    # Package scripts are raw commands, not independently cacheable entry points.
    build: { cache: false, dependsOn: [] }
    pack: { cache: false, dependsOn: [] }
    check: { cache: false, dependsOn: [] }
    test: { cache: false, dependsOn: [] }
    test:features: { cache: false, dependsOn: [] }
    optimize-svg: { cache: false, dependsOn: [] }
    social-card: { cache: false, dependsOn: [] }
    dev: { cache: false, dependsOn: [] }
    preview: { cache: false, dependsOn: [] }
    bench: { cache: false, dependsOn: [] }
    pack:tgz: { cache: false, dependsOn: [] }
    publish: { cache: false, dependsOn: [] }
    build:release: { cache: false, dependsOn: [] }
    binding:regenerate: { cache: false, dependsOn: [] }
    test:browser: { cache: false, dependsOn: [] }
    test:coverage: { cache: false, dependsOn: [] }
    test:coverage:cli: { cache: false, dependsOn: [] }
    test:coverage:native: { cache: false, dependsOn: [] }
    test:doctests: { cache: false, dependsOn: [] }
    test:color-proof: { cache: false, dependsOn: [] }
    test:fixtures:refresh: { cache: false, dependsOn: [] }

    # Unrestricted report/export/update modes remain uncached (see cache-audit README).
    # Dev/preview, publishing, measurements, and source-mutating maintenance are
    # explicit executions; defining a pipeline never schedules it automatically.
    bench:vitest: { cache: false, dependsOn: [native:release] }
    test:compat: { cache: false, dependsOn: [native] }
    coverage:scripts: { cache: false, dependsOn: [] }
    engine:bench: { cache: false, dependsOn: [] }
    engine:coverage: { cache: false, dependsOn: [] }
    engine:coverage:cli: { cache: false, dependsOn: [] }
    engine:color-proof: { cache: false, dependsOn: [] }
    adapter:browser: { cache: false, dependsOn: [native, adapter:color-proof] }
    adapter:color-proof: { cache: false, dependsOn: [] }
    adapter:coverage: { cache: false, dependsOn: [] }
    adapter:coverage:native: { cache: false, dependsOn: [] }
    adapter:binding:regenerate: { cache: false, dependsOn: [] }
    adapter:bench: { cache: false, dependsOn: [] }
    native:release:
        cache: true
        dependsOn: [adapter:test]
        inputs:
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml}'
            - packages/webfont-generator/**
        env: &rust-env
            - RUSTC
            - RUSTC_WRAPPER
            - RUSTC_WORKSPACE_WRAPPER
            - RUSTDOC
            - RUSTDOCFLAGS
            - RUSTFLAGS
            - CARGO_ENCODED_RUSTFLAGS
            - CARGO_BUILD_TARGET
            - CARGO_TARGET_DIR
            - CARGO_INCREMENTAL
            - RUSTUP_TOOLCHAIN
            - CC
            - CXX
            - AR
            - LD
            - CFLAGS
            - CXXFLAGS
            - CPPFLAGS
            - LDFLAGS
            - SDKROOT
            - MACOSX_DEPLOYMENT_TARGET
            - DYLD_FALLBACK_LIBRARY_PATH
            - CARGO_PROFILE_RELEASE_LTO
            - CARGO_PROFILE_RELEASE_OPT_LEVEL
            - CARGO_PROFILE_RELEASE_CODEGEN_UNITS
            - CARGO_PROFILE_RELEASE_DEBUG
            - CARGO_PROFILE_RELEASE_STRIP
            - UPDATE_SVG_FIXTURES
            - WASM_BINDGEN
        outputs: [packages/webfont-generator/binding.js, packages/webfont-generator/binding.d.ts, packages/webfont-generator/*.node]
    browser:tgz:
        cache: true
        dependsOn: [browser:pack]
        inputs:
            - '{LICENSE,package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,.npmrc,.pnpmfile.*}'
            - packages/webfont-browser/{package.json,README.md,LICENSE*,.npmignore}
        outputs: [packages/webfont-browser/atlowchemi-webfont-browser-generator-*.tgz]
    browser:coverage: { cache: false, dependsOn: [browser:pack] }
    browser:publish: { cache: false, dependsOn: [browser:tgz] }
    plugin:dev: { cache: false, dependsOn: [] }
    plugin:tgz:
        cache: true
        dependsOn: [plugin:pack]
        inputs:
            - '{LICENSE,package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,.npmrc,.pnpmfile.*}'
            - packages/vite-svg-2-webfont/{package.json,README.md,LICENSE*,.npmignore}
        outputs: [packages/vite-svg-2-webfont/vite-svg-2-webfont-*.tgz]
    plugin:browser: { cache: false, dependsOn: [native] }
    plugin:fixtures: { cache: false, dependsOn: [plugin:pack] }
    # Release CI supplies the native artifacts; preserve the existing dependency
    # bypass by running raw pack scripts inside this uncached publishing command.
    plugin:publish: { cache: false, dependsOn: [] }
    example:dev: { cache: false, dependsOn: [plugin:pack, docs:svg] }
    example:preview: { cache: false, dependsOn: [example] }
    docs:dev: { cache: false, dependsOn: [docs:social, plugin:pack, browser:pack] }
    docs:preview: { cache: false, dependsOn: [docs] }

    # Formatting is a pipeline sibling, not a dependency that widens package check keys.
    fmt:rust:
        cache: true
        dependsOn: []
        outputs: []
        env: [RUSTUP_TOOLCHAIN, RUSTFMT, RUSTFMT_CONFIG_PATH]
        inputs:
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,Cargo.toml,Cargo.lock,rust-toolchain*,rustfmt.toml,.rustfmt.toml}'
            - '**/{Cargo.toml,rustfmt.toml,.rustfmt.toml,rust-toolchain,rust-toolchain.toml}'
            - '{crates,packages}/**/*.rs'
            - .cargo/**
    # Validated success-only caches; no compiler outputs are restored.
    # External-tool upgrades require a task-cache reset (see cache-audit README).
    engine:check:
        cache: true
        dependsOn: []
        outputs: []
        env: *rust-env
        inputs: &engine-inputs
            - &auditor-source 'crates/cache-audit/{Cargo.toml,README.md,build.rs,src/**/*.rs,tests/**/*.rs,benches/**/*.rs,examples/**/*.rs,patches/**,scripts/prepare.mjs}'
            - '**/.gitignore'
            - patches/**
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,Cargo.toml,Cargo.lock,.npmrc,.pnpmfile.*,rust-toolchain*}'
            - .cargo/**
            - crates/webfont-generator/**
            - '{crates,packages}/*/{Cargo.toml,package.json}'
            - packages/.cargo/**
            - packages/{Cargo.toml,pnpm-workspace.yaml,rust-toolchain,rust-toolchain.toml}
    engine:doctests:
        cache: true
        dependsOn: []
        env: *rust-env
        inputs:
            - *auditor-source
            - '**/.gitignore'
            - patches/**
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,Cargo.toml,Cargo.lock,.npmrc,.pnpmfile.*,rust-toolchain*}'
            - .cargo/**
            - crates/webfont-generator/**
            - '{crates,packages}/*/{Cargo.toml,package.json}'
            - packages/.cargo/**
            - packages/{Cargo.toml,pnpm-workspace.yaml,rust-toolchain,rust-toolchain.toml}
            - scripts/ci/doctests.mjs
        outputs: [test-results/doctests.xml]
    engine:features:
        cache: true
        outputs: []
        env: *rust-env
        inputs: *engine-inputs
        dependsOn: [engine:check]
    engine:test:
        cache: true
        outputs: []
        env: *rust-env
        inputs: *engine-inputs
        dependsOn: [engine:check, engine:features]
    adapter:check:
        cache: true
        dependsOn: [engine:check]
        outputs: []
        env: *rust-env
        inputs: &adapter-inputs
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml}'
            # Rust validation must not key generated binding outputs: deleting a
            # release artifact must still allow its producer's cache restoration.
            - packages/webfont-generator/{Cargo.toml,build.rs,package.json,README.md,rust-toolchain*}
            - packages/webfont-generator/{native,src,tests,benches,examples,templates,.cargo}/**
    adapter:test:
        cache: true
        outputs: []
        env: *rust-env
        inputs: *adapter-inputs
        dependsOn: [adapter:check, engine:test]

    # Validated native cache; external-tool upgrades require a task-cache reset.
    # Cargo's intermediate target directory is deliberately not a restored output.
    native:
        cache: true
        dependsOn: []
        inputs:
            - *auditor-source
            - patches/**
            - '**/.gitignore'
            - package.json
            - pnpm-workspace.yaml
            - pnpm-tasks.yaml
            - pnpm-lock.yaml
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - rust-toolchain*
            - crates/webfont-generator/**
            - packages/webfont-browser/Cargo.toml
            - packages/webfont-browser/README.md
            - packages/webfont-browser/**/*.rs
            - packages/*/package.json
            - crates/*/package.json
            # Optional configuration/loader probes must affect the key if created.
            - .npmrc
            - .pnp.cjs
            - .pnpmfile.*
            - package.{json5,yaml}
            - libgcc_s.so.1
            - packages/.cargo/**
            - packages/{Cargo.toml,HEAD,pnpm-workspace.yaml,rust-toolchain,rust-toolchain.toml}
            - pnpm11/pnpm/package.json
            # Cargo/NAPI inspect adapter assets and target-discovery files too.
            - packages/webfont-generator/**
        outputs:
            - packages/webfont-generator/binding.js
            - packages/webfont-generator/binding.d.ts
            - packages/webfont-generator/*.node
        env: *rust-env
    wasm:
        cache: true
        dependsOn: []
        inputs:
            - *auditor-source
            - patches/**
            - package.json
            - pnpm-workspace.yaml
            - pnpm-tasks.yaml
            - pnpm-lock.yaml
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - rust-toolchain*
            - crates/webfont-generator/**
            - packages/webfont-generator/Cargo.toml
            - packages/webfont-browser/package.json
            - packages/webfont-browser/Cargo.toml
            - packages/webfont-browser/native/**
            - packages/webfont-browser/scripts/**
            - packages/webfont-browser/{README.md,build.rs}
            - packages/webfont-browser/{src,tests}/**/*.rs
            - packages/webfont-generator/{README.md,build.rs}
            - packages/webfont-generator/{src,tests}/**/*.rs
            - '**/{package.json,pnpm-workspace.yaml,rust-toolchain,rust-toolchain.toml,.pnp.cjs}'
            - '{.npmrc,.pnpmfile.cjs,.pnpmfile.mjs,package.json5,package.yaml}'
        outputs: [packages/webfont-browser/generated/**]
        env: *rust-env
    browser:pack:
        cache: true
        env: [NODE_ENV]
        dependsOn: [wasm]
        inputs:
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,tsconfig*.json,vite.config.*,env.d.ts,.npmrc,.pnpmfile.*}'
            - '**/{package.json,pnpm-workspace.yaml,.pnp.cjs,tsconfig*.json}'
            - packages/webfont-browser/{src,scripts}/**
            - packages/webfont-browser/{vite.config.*,tsconfig*.json,.env,.env.*}
            - &postcss-ancestors '{.postcssrc,.postcssrc.*,postcss.config.*,packages/.postcssrc,packages/.postcssrc.*,packages/postcss.config.*,packages/deno.json,packages/deno.jsonc,packages/lerna.json}'
            - packages/webfont-browser/{.postcssrc,.postcssrc.*,postcss.config.*,deno.json,deno.jsonc,lerna.json}
        outputs: [packages/webfont-browser/dist/**]
    browser:check:
        cache: true
        dependsOn: [wasm]
        outputs: []
        env: *rust-env
        inputs:
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml}'
            - packages/webfont-browser/{Cargo.toml,README.md,build.rs,rust-toolchain*}
            - packages/webfont-browser/{native,src,tests,examples,benches,.cargo}/**
    browser:test:
        cache: false
        dependsOn: [browser:check, browser:pack]
    plugin:pack:
        # Hits reuse the bundle and skip analysis uploads; request --no-cache for a fresh report.
        cache: true
        env: [NODE_ENV, CODECOV_TOKEN, ALLOW_BUNDLE_ANALYSIS]
        dependsOn: [native]
        inputs:
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,tsconfig*.json,vite.config.*,env.d.ts,.npmrc,.pnpmfile.*}'
            - '**/{package.json,pnpm-workspace.yaml,.pnp.cjs,tsconfig*.json}'
            - packages/vite-svg-2-webfont/{src,scripts}/**
            - packages/vite-svg-2-webfont/{vite.config.*,tsconfig*.json,.env,.env.*}
            - *postcss-ancestors
            - packages/vite-svg-2-webfont/{.postcssrc,.postcssrc.*,postcss.config.*,deno.json,deno.jsonc,lerna.json,rust-toolchain,rust-toolchain.toml}
        outputs: [packages/vite-svg-2-webfont/dist/**]
    plugin:test:
        cache: true
        dependsOn: [native]
        outputs: []
        env: [VITE_COMPAT_MAJOR, NODE_ENV, NODE_OPTIONS, NAPI_RS_NATIVE_LIBRARY_PATH, NAPI_RS_ENFORCE_VERSION_CHECK, NAPI_RS_FORCE_WASI, NAPI_RS_WASI_FLAVOR]
        inputs:
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,tsconfig*.json,vite.config.*,env.d.ts,.npmrc,.pnpmfile.*}'
            - patches/**
            - '**/.gitignore'
            - '**/{package.json,pnpm-workspace.yaml,.pnp.cjs,tsconfig*.json}'
            - packages/vite-svg-2-webfont/{src,tests}/**
            - packages/vite-svg-2-webfont/{vite.config.*,tsconfig*.json,.env,.env.*}
            - *postcss-ancestors
            - packages/vite-svg-2-webfont/{.postcssrc,.postcssrc.*,postcss.config.*,deno.json,deno.jsonc,lerna.json}
    test:js:
        cache: false
        dependsOn: [native, browser:pack]
    coverage:
        cache: false
        dependsOn: [native]

    docs:svg:
        dependsOn: []
        inputs:
            - patches/**
            - package.json
            - pnpm-workspace.yaml
            - pnpm-tasks.yaml
            - pnpm-lock.yaml
            - packages/docs/package.json
            - packages/docs/assets/svg/**
            - packages/docs/svgo.config.*
            - '**/{package.json,pnpm-workspace.yaml,rust-toolchain,rust-toolchain.toml,.pnp.cjs}'
            - '{.npmrc,.pnpmfile.cjs,.pnpmfile.mjs,package.json5,package.yaml}'
            - '**/svgo.config.{js,cjs,mjs,ts}'
        outputs: [packages/docs/public/**/*.svg]
    docs:social:
        # Bundled fonts avoid host-font inputs; fresh-build reproducibility verified.
        cache: true
        dependsOn: [docs:svg]
        inputs:
            - package.json
            - pnpm-workspace.yaml
            - pnpm-tasks.yaml
            - pnpm-lock.yaml
            - packages/docs/package.json
            - packages/docs/scripts/generate-social-card.ts
            - packages/docs/public/social-card.svg
            - packages/docs/public/github-social-preview.svg
        outputs: [packages/docs/public/social-card.png, packages/docs/public/github-social-preview.png]
    docs:
        # Shared virtual declarations accumulate across consumers; cache only after
        # their ownership and restoration are isolated from the plugin package.
        cache: false
        env: [NODE_ENV, DOCS_URL]
        dependsOn: [docs:social, plugin:pack, browser:pack]
        inputs:
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,tsconfig*.json,vite.config.*,env.d.ts,.npmrc,.pnpmfile.*}'
            - '**/{package.json,pnpm-workspace.yaml,.pnp.cjs,tsconfig*.json}'
            - packages/docs/**
            - packages/webfont-generator/CHANGELOG.md
            - packages/webfont-browser/CHANGELOG.md
            - packages/vite-svg-2-webfont/CHANGELOG.md
            - crates/webfont-generator/CHANGELOG.md
        outputs: [packages/docs/dist/**, packages/docs/src/fonts/examples/write-files/generated/**]
    example:
        # Ignored .env.local/.env.production.local cannot be native file inputs.
        cache: false
        env: [NODE_ENV]
        dependsOn: [plugin:pack, docs:svg]
        inputs:
            - '{package.json,pnpm-workspace.yaml,pnpm-tasks.yaml,pnpm-lock.yaml,tsconfig*.json,vite.config.*,env.d.ts,.npmrc,.pnpmfile.*}'
            - '**/{package.json,pnpm-workspace.yaml,.pnp.cjs,tsconfig*.json}'
            - packages/example/**
        outputs: [packages/example/dist/**]
