name: Dormant pipeline audit

on:
    workflow_dispatch:
    schedule:
        - cron: '23 5 * * 1'

permissions:
    contents: read

jobs:
    pipelines:
        name: Execute dormant pipelines
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: wasm32-unknown-unknown
                  components: clippy, rustfmt
            - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
              with:
                  node-version-file: .node-version
                  run-install: |
                      args: [--frozen-lockfile]
                  cache: true
            - run: vp exec playwright install --with-deps chromium firefox webkit
            - name: Execute every dormant pipeline uncached
              run: vp exec node scripts/verify-pipelines.mjs --run
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: dormant-pipelines-linux-x64
                  path: artifacts/cache-audit/pipelines/
                  if-no-files-found: warn
    build-audits:
        name: Build cache declarations (report only)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
              with:
                  node-version-file: .node-version
                  run-install: |
                      args: [--frozen-lockfile]
                  cache: true
            - name: Verify installation preserved the lockfile
              run: git diff --exit-code HEAD -- pnpm-lock.yaml
            - name: Verify dormant command and prerequisite parity
              run: vp run next:verify
            - name: Record toolchain identity
              run: |
                  mkdir -p artifacts/cache-audit
                  vp exec node scripts/next-pipeline.mjs --fingerprint > artifacts/cache-audit/toolchain.json
            - name: Install isolated auditor toolchain
              run: rustup toolchain install nightly-2026-08-02 --profile minimal --component clippy --component rustfmt
            - name: Build and test observer
              working-directory: crates/cache-audit
              env:
                  CARGO_TARGET_DIR: ${{ runner.temp }}/cache-audit-build
              run: |
                  node scripts/cargo.mjs build --locked
                  node scripts/cargo.mjs test --locked
                  node scripts/cargo.mjs clippy --locked -- -D warnings
            - name: Audit all build tasks with fresh compiler state
              id: audit
              continue-on-error: true
              env:
                  CACHE_AUDIT_BIN: ${{ runner.temp }}/cache-audit-build/debug/cache-audit
              run: node crates/cache-audit/scripts/audit.mjs --all
            - name: Verify deliberately missing native declarations fail
              if: steps.audit.outcome == 'success'
              env:
                  CACHE_AUDIT_BIN: ${{ runner.temp }}/cache-audit-build/debug/cache-audit
              run: node crates/cache-audit/scripts/negative.mjs
            - name: Report audit status
              if: always()
              env:
                  AUDIT_OUTCOME: ${{ steps.audit.outcome }}
              run: |
                  echo "Build filesystem audits: ${AUDIT_OUTCOME}. This rollout is report-only; normal CI still uses Vite+." >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: cache-audit-linux-x64
                  path: artifacts/cache-audit/
                  if-no-files-found: warn
