name: Cache contract audit

on:
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: '23 5 * * 1'

permissions:
    contents: read

concurrency:
    group: cache-audit-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    select-work:
        name: Select affected audit work
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            work: ${{ steps.work.outputs.work }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: wasm32-unknown-unknown
                  components: clippy, rustfmt
                  toolchain: nightly-2026-08-02
            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: .node-version
                  require-lockfile: true
                  cache: true
            - name: Select affected packages conservatively
              run: node scripts/ci/affected-selection.ts
            - name: Select finite pipelines
              shell: bash
              run: |
                  pnpm config get pipelines --location project --json > pipelines.json
                  jq -r '
                    {
                      "bench": "Fresh measurements belong to benchmark CI",
                      "engine-bench": "Fresh measurements belong to benchmark CI",
                      "adapter-bench": "Fresh measurements belong to benchmark CI",
                      "engine-coverage": "Requires the dedicated Rust coverage toolchain",
                      "cli-coverage": "Requires the dedicated Rust coverage toolchain",
                      "adapter-coverage": "Requires the dedicated Rust coverage toolchain",
                      "native-coverage": "Requires the dedicated native coverage toolchain",
                      "browser-coverage": "Instrumented browser reports belong to coverage CI",
                      "binding-regenerate": "Mutates generated binding sources",
                      "fixtures-refresh": "Mutates tracked font fixtures",
                      "browser-publish": "Publishes packages to the registry",
                      "plugin-publish": "Publishes packages to the registry",
                      "plugin-dev": "Long-running development server",
                      "example-dev": "Long-running development server",
                      "example-preview": "Long-running preview server",
                      "docs-dev": "Long-running development server",
                      "docs-preview": "Long-running preview server"
                    } as $blocked
                    | (($blocked | keys) - keys) as $missing
                    | if ($missing | length) > 0 then
                        error("Unknown blocked pipelines: " + ($missing | join(", ")))
                      else
                        keys[] | select($blocked[.] == null)
                      end
                  ' pipelines.json > selected-pipelines.txt
            - name: Plan affected pipelines and audits
              id: work
              # Normal PR execution lives in main.yaml; only manual/weekly runs sweep pipelines.
              run: node scripts/ci/select-audit-work.ts
              env:
                  AUDIT_ONLY: ${{ github.event_name == 'pull_request' }}

    pipelines:
        name: Affected validation (worker ${{ matrix.id }})
        needs: [select-work, build-audits]
        if: ${{ fromJSON(needs.select-work.outputs.work).workers[0] != null }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                include: ${{ fromJSON(needs.select-work.outputs.work).workers }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: wasm32-unknown-unknown
                  components: clippy, rustfmt
                  toolchain: nightly-2026-08-02
            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: .node-version
                  require-lockfile: true
                  cache: true
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: cache-audit-binary-linux-x64
                  path: ${{ runner.temp }}/cache-audit-bin
            - run: chmod +x "$RUNNER_TEMP/cache-audit-bin/cache-audit"
            - name: Execute selected pipelines uncached
              shell: bash
              env:
                  PIPELINES: ${{ toJSON(matrix.pipelines) }}
              run: |
                  mkdir -p artifacts/cache-audit/pipelines
                  status=0
                  while IFS= read -r pipeline; do
                    log="artifacts/cache-audit/pipelines/$pipeline.log"
                    if pnpm pipeline "$pipeline" --full --no-cache > "$log" 2>&1; then
                      echo "$pipeline: passed"
                    else
                      echo "::error::$pipeline failed; see $log"
                      tail -n 80 "$log"
                      status=1
                    fi
                  done < <(jq -r '.[]' <<< "$PIPELINES")
                  exit "$status"
            - name: Audit selected tasks with fresh compiler state
              id: audit
              if: ${{ !cancelled() && matrix.audits[0] != null }}
              shell: bash
              env:
                  CACHE_AUDIT_BIN: ${{ runner.temp }}/cache-audit-bin/cache-audit
                  AUDIT_TASKS: ${{ toJSON(matrix.audits) }}
              run: |
                  status=0
                  while IFS= read -r task; do
                    if pnpm --dir crates/cache-audit run audit -- --task "$task" --reports "artifacts/cache-audit/tasks/${task//:/-}"; then
                      echo "$task: passed" >> "$GITHUB_STEP_SUMMARY"
                      if [[ "$task" == native ]]; then
                        echo 'native_passed=true' >> "$GITHUB_OUTPUT"
                      fi
                    else
                      echo "$task: failed (see artifacts)" >> "$GITHUB_STEP_SUMMARY"
                      status=1
                    fi
                  done < <(jq -r '.[]' <<< "$AUDIT_TASKS")
                  exit "$status"
            - name: Verify deliberately missing native declarations fail
              if: ${{ !cancelled() && steps.audit.outputs.native_passed == 'true' }}
              env:
                  CACHE_AUDIT_BIN: ${{ runner.temp }}/cache-audit-bin/cache-audit
              run: pnpm --dir crates/cache-audit run audit:negative
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: affected-validation-linux-x64-${{ matrix.id }}
                  path: artifacts/cache-audit/
                  if-no-files-found: warn
    build-audits:
        name: Build and verify shared auditor
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: wasm32-unknown-unknown
                  toolchain: nightly-2026-08-02
            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: .node-version
                  require-lockfile: true
                  cache: true
            - name: Verify installation preserved the lockfile
              run: git diff --exit-code HEAD -- pnpm-lock.yaml Cargo.lock .cargo/config.toml
            - name: Record external toolchain for audit diagnostics
              run: |
                  mkdir -p artifacts/cache-audit
                  {
                    pnpm --version
                    node --version
                    rustc -vV
                    cargo --version
                    cc --version
                    uname -a
                  } > artifacts/cache-audit/toolchain.txt
            - name: Build and test observer
              env:
                  CARGO_TARGET_DIR: ${{ runner.temp }}/cache-audit-build
              run: |
                  pnpm --dir crates/cache-audit run build
                  pnpm --dir crates/cache-audit run test
                  pnpm --dir crates/cache-audit run check
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: cache-audit-binary-linux-x64
                  path: ${{ runner.temp }}/cache-audit-build/debug/cache-audit
                  if-no-files-found: error
                  retention-days: 1
            - name: Verify stable product compiler and published crate
              shell: bash
              run: |
                  rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
                  export RUSTC="$(rustup which --toolchain stable rustc)"
                  export RUSTDOC="$(rustup which --toolchain stable rustdoc)"
                  cargo check --locked -p webfont-generator --all-features
                  cargo check --locked -p webfont-generator-napi
                  cargo check --locked -p webfont-browser --target wasm32-unknown-unknown
                  cargo package --locked -p webfont-generator
                  mkdir -p "$RUNNER_TEMP/stable-package"
                  tar -xzf target/package/webfont-generator-*.crate -C "$RUNNER_TEMP/stable-package"
                  cd "$RUNNER_TEMP"/stable-package/webfont-generator-*
                  cargo +stable check --locked --all-features
            - name: Compare Rust graphs with installed pnpm
              run: ${{ runner.temp }}/cache-audit-build/debug/cache-audit graph --all --verify-pnpm > artifacts/cache-audit/graphs.json
            - name: Verify installed pnpm cache semantics
              env:
                  CACHE_AUDIT_BIN: ${{ runner.temp }}/cache-audit-build/debug/cache-audit
              run: pnpm --dir crates/cache-audit run test:compat
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: cache-audit-linux-x64
                  path: artifacts/cache-audit/
                  if-no-files-found: warn
