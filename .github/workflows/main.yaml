name: CI

on:
    push:
        branches:
            - 'main'
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        name: lint and check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
              with:
                  components: clippy, rustfmt
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-workspace-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-workspace-${{ runner.os }}-
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version-file: .node-version
                  run-install: true
                  cache: true
            - run: vp check
            - run: vp run @atlowchemi/webfont-generator#check

    rust-coverage:
        name: Rust coverage (${{ matrix.suite }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: engine
                      task: '@atlowchemi/webfont-engine#test:coverage'
                      flag: rust-tests
                    - suite: cli
                      task: '@atlowchemi/webfont-engine#test:coverage:cli'
                      flag: cli-tests
                    - suite: adapter
                      task: '@atlowchemi/webfont-generator#test:coverage'
                      flag: rust-tests
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
              with:
                  components: llvm-tools-preview
            - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
              with:
                  tool: cargo-llvm-cov,cargo-nextest
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version-file: .node-version
                  run-install: true
                  cache: true
            - run: vp run '${{ matrix.task }}'
            - name: Upload Rust coverage
              if: ${{ !cancelled() && hashFiles(format('coverage/rust-{0}/rust.lcov', matrix.suite)) != '' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  disable_search: true
                  files: coverage/rust-${{ matrix.suite }}/rust.lcov
                  flags: ${{ matrix.flag }}
                  name: rust-${{ matrix.suite }}
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload Rust test results
              if: ${{ !cancelled() && hashFiles(format('coverage/rust-{0}/junit.xml', matrix.suite)) != '' }}
              uses: ./.github/actions/upload-test-results
              with:
                  name: rust-${{ matrix.suite }}-linux-x64
                  files: coverage/rust-${{ matrix.suite }}/junit.xml
                  token: ${{ secrets.CODECOV_TOKEN }}
            # nextest does not execute doctests. Keep both Cargo feature configurations.
            - name: Rust doctests
              if: ${{ !cancelled() && matrix.suite == 'engine' }}
              run: vp run @atlowchemi/webfont-engine#test:doctests
            - name: Upload doctest invocation results
              if: ${{ !cancelled() && matrix.suite == 'engine' && hashFiles('test-results/doctests.xml') != '' }}
              uses: ./.github/actions/upload-test-results
              with:
                  name: rust-doctest-invocations-linux-x64
                  files: test-results/doctests.xml
                  token: ${{ secrets.CODECOV_TOKEN }}

    native-coverage:
        name: Native Vitest coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
              with:
                  components: llvm-tools-preview
            - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
              with:
                  tool: cargo-llvm-cov
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version-file: .node-version
                  run-install: true
                  cache: true
            - run: vp run @atlowchemi/webfont-generator#test:coverage:native
            - name: Upload Vitest-origin Rust coverage
              if: ${{ !cancelled() && hashFiles('coverage/napi-vitest/rust.lcov') != '' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  disable_search: true
                  files: coverage/napi-vitest/rust.lcov
                  flags: napi-vitest-rust
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload Vitest-origin JS coverage
              if: ${{ !cancelled() && hashFiles('coverage/napi-vitest/js/lcov.info') != '' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  disable_search: true
                  files: coverage/napi-vitest/js/lcov.info
                  flags: napi-vitest-js
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload instrumented test results
              if: ${{ !cancelled() && hashFiles('coverage/napi-vitest/junit.xml') != '' }}
              uses: ./.github/actions/upload-test-results
              with:
                  name: napi-instrumented-linux-x64-node26
                  files: coverage/napi-vitest/junit.xml
                  token: ${{ secrets.CODECOV_TOKEN }}

    build:
        name: Build cross-platform bindings
        needs: [ci]
        uses: ./.github/workflows/build-native.yaml

    docs:
        name: build docs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version-file: .node-version
                  run-install: true
                  cache: true
            - run: vp run @atlowchemi/vite-svg-webfont-docs#build

    test-browser:
        name: test browser font compatibility
        needs: [ci]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version-file: .node-version
                  run-install: true
                  cache: true
            - name: Install browsers
              run: vp exec playwright install --with-deps chromium firefox webkit
            - name: Run browser tests
              id: engine-browser-tests
              run: vp run @atlowchemi/webfont-generator#test:browser
              env:
                  CI_TEST_REPORT: test-results/engine-browser.xml
                  CI_TEST_SUITE: engine-browser-linux-x64
            - name: Run plugin browser tests
              id: plugin-browser-tests
              if: ${{ !cancelled() }}
              run: vp run vite-svg-2-webfont#test:browser
              env:
                  CI_TEST_REPORT: test-results/plugin-browser.xml
                  CI_TEST_SUITE: plugin-browser-linux-x64
            - name: Upload engine browser results
              if: ${{ !cancelled() && (steps.engine-browser-tests.outcome == 'success' || hashFiles('test-results/engine-browser.xml') != '') }}
              uses: ./.github/actions/upload-test-results
              with:
                  name: engine-browser-linux-x64
                  files: test-results/engine-browser.xml
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Upload plugin browser results
              if: ${{ !cancelled() && (steps.plugin-browser-tests.outcome == 'success' || hashFiles('test-results/plugin-browser.xml') != '') }}
              uses: ./.github/actions/upload-test-results
              with:
                  name: plugin-browser-linux-x64
                  files: test-results/plugin-browser.xml
                  token: ${{ secrets.CODECOV_TOKEN }}

    test-host:
        name: test ${{ matrix.settings.target }} (node ${{ matrix.node }})
        needs: [build]
        strategy:
            fail-fast: false
            matrix:
                settings:
                    - target: aarch64-unknown-linux-gnu
                      host: ubuntu-24.04-arm
                      architecture: arm64
                    - target: x86_64-apple-darwin
                      host: macos-15-intel
                      architecture: x64
                    - target: aarch64-apple-darwin
                      host: macos-latest
                      architecture: arm64
                    - target: x86_64-pc-windows-msvc
                      host: windows-latest
                      architecture: x64
                    - target: aarch64-pc-windows-msvc
                      host: windows-11-arm
                      architecture: arm64
                node: ['22', '24', '26']
        runs-on: ${{ matrix.settings.host }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  runtime: node@${{ matrix.node }}
                  cache: true
            - name: Download binding
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: bindings-${{ matrix.settings.target }}
                  path: packages/webfont-generator/
            - name: Verify binding
              shell: bash
              run: ls packages/webfont-generator/*.node
            - name: Build plugin
              run: pnpm --filter vite-svg-2-webfont exec vp pack
            - name: Run tests
              id: host-tests
              run: pnpm exec vp test --run --project='!*-browser*'
              env:
                  CI_TEST_REPORT: test-results/host.xml
                  CI_TEST_SUITE: host-${{ matrix.settings.target }}-node${{ matrix.node }}
            - name: Upload host test results
              if: ${{ !cancelled() && (steps.host-tests.outcome == 'success' || hashFiles('test-results/host.xml') != '') }}
              uses: ./.github/actions/upload-test-results
              with:
                  name: host-${{ matrix.settings.target }}-node${{ matrix.node }}
                  files: test-results/host.xml
                  token: ${{ secrets.CODECOV_TOKEN }}

    test-docker:
        name: test ${{ matrix.arch }}-linux-musl
        needs: [build]
        strategy:
            fail-fast: false
            matrix:
                arch: [x86_64, aarch64]
                include:
                    - arch: aarch64
                      args: '--platform linux/arm64'
                      runner: ubuntu-24.04-arm
                    - arch: x86_64
                      args: ''
                      runner: ubuntu-latest
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: extract node version from .node-version
              id: node-version
              run: echo "node_version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
            - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  runtime: node@${{ steps.node-version.outputs.node_version }}
                  cache: true
            - name: Download binding
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: bindings-${{ matrix.arch }}-unknown-linux-musl
                  path: packages/webfont-generator/
            - name: Build plugin
              run: pnpm --filter vite-svg-2-webfont exec vp pack
            - name: Resolve pnpm version
              id: pnpm-version
              run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).packageManager.split('@', 2)[1].split('+')[0]")" >> "$GITHUB_OUTPUT"
            - name: Run tests
              id: musl-tests
              uses: tj-actions/docker-run@1d25a677da8f1243a138dc5db21e307e92986ffe # v2.2.1
              with:
                  image: node:26-alpine
                  name: test-${{ matrix.arch }}-linux-musl
                  options: ${{ matrix.args }} -v ${{ github.workspace }}:/build -w /build -e CI=true -e CI_TEST_REPORT=test-results/musl.xml -e CI_TEST_SUITE=musl-${{ matrix.arch }}-node26
                  # Pacquet 0.2.x ships glibc-only binaries via @pacquet/linux-*;
                  # spawning them on Alpine fails with ENOENT because the glibc
                  # loader isn't present. Strip the configDependencies block so
                  # this matrix entry falls back to pnpm's JS installer.
                  args: |
                      sh -c "set -e && \
                        npm install -g pnpm@${{ steps.pnpm-version.outputs.version }} && \
                        sed -i '/^configDependencies:/,/^$/d' pnpm-workspace.yaml && \
                        pnpm install --frozen-lockfile --ignore-scripts && \
                        pnpm exec vp test --run --project='!*-browser*'"
            - name: Upload musl test results
              if: ${{ !cancelled() && (steps.musl-tests.outcome == 'success' || hashFiles('test-results/musl.xml') != '') }}
              uses: ./.github/actions/upload-test-results
              with:
                  name: musl-${{ matrix.arch }}-node26
                  files: test-results/musl.xml
                  token: ${{ secrets.CODECOV_TOKEN }}

    test-vite-compat:
        name: test (node ${{ matrix.node_version }}, vite ${{ matrix.vite_major }})
        needs: [build]
        env:
            VITE_COMPAT_MAJOR: ${{ matrix.vite_major }}
            CI_TEST_REPORT: test-results/vite-compat.xml
            CI_TEST_SUITE: vite${{ matrix.vite_major }}-node${{ matrix.node_version }}-linux-x64
        strategy:
            matrix:
                include:
                    - node_version: 22.x
                      vite_major: 8
                      primary: false
                    - node_version: 24.x
                      vite_major: 8
                      primary: false
                    - node_version: 26.x
                      vite_major: 8
                      primary: true
                    - node_version: 26.x
                      vite_major: 6
                      primary: false
                    - node_version: 26.x
                      vite_major: 7
                      primary: false
            fail-fast: false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version: ${{ matrix.node_version }}
                  run-install: false
                  cache: false
            - name: Select vite major
              run: node ./scripts/ci/set-vite-major.ts ${{ matrix.vite_major }}
            - run: vp install --no-frozen-lockfile
            - name: Download binding
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: bindings-x86_64-unknown-linux-gnu
                  path: packages/webfont-generator/
            - name: Verify binding
              run: ls packages/webfont-generator/*.node
            - name: Build plugin
              run: vp run --ignore-depends-on vite-svg-2-webfont#pack
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
                  ALLOW_BUNDLE_ANALYSIS: ${{ matrix.primary }}
            - name: Verify vite version
              run: |
                  VITE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('node_modules/vite-compat/package.json', 'utf8')).version")
                  echo "Resolved vite version: ${VITE_VERSION}"
                  case "${VITE_VERSION}" in
                    ${{ matrix.vite_major }}.*) ;;
                    *)
                      echo "Expected Vite major ${{ matrix.vite_major }}, got ${VITE_VERSION}" >&2
                      exit 1
                      ;;
                  esac
            - name: Run coverage
              id: coverage-tests
              if: ${{ matrix.primary }}
              run: |
                  vp test --run --project='!*-browser*' --coverage --coverage.include='packages/vite-svg-2-webfont/src/**'
                  test -s coverage/lcov.info
            - name: Upload coverage reports to Codecov
              if: ${{ !cancelled() && matrix.primary && hashFiles('coverage/lcov.info') != '' }}
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  disable_search: true
                  files: coverage/lcov.info
                  flags: plugin-tests
                  token: ${{ secrets.CODECOV_TOKEN }}
            - name: Run tests
              id: compat-tests
              if: ${{ !matrix.primary }}
              run: vp test --run --project='!*-browser*'
            - name: Upload compatibility test results
              if: ${{ !cancelled() && (steps.coverage-tests.outcome == 'success' || steps.compat-tests.outcome == 'success' || hashFiles('test-results/vite-compat.xml') != '') }}
              uses: ./.github/actions/upload-test-results
              with:
                  name: vite${{ matrix.vite_major }}-node${{ matrix.node_version }}-linux-x64
                  files: test-results/vite-compat.xml
                  token: ${{ secrets.CODECOV_TOKEN }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ matrix.primary }}
              with:
                  name: coverage-node-${{ matrix.node_version }}-vite-${{ matrix.vite_major }}
                  path: coverage

    # Single fan-in job for branch protection: matrix job names are dynamic
    # (one per OS × node × vite combination) and would need re-listing in the
    # repo settings every time the matrix changes. Requiring this one job
    # instead covers every dependent without that maintenance burden.
    required-checks:
        name: Required checks
        if: always()
        needs: [ci, rust-coverage, native-coverage, build, docs, test-browser, test-host, test-docker, test-vite-compat]
        runs-on: ubuntu-latest
        steps:
            - name: Verify all dependent jobs succeeded
              run: |
                  if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" \
                     || "${{ contains(needs.*.result, 'cancelled') }}" == "true" \
                     || "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
                      echo "::error::One or more required jobs failed, were cancelled, or were skipped."
                      exit 1
                  fi
                  echo "All required jobs succeeded."
