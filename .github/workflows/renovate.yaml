name: Renovate

on:
    schedule:
        - cron: '23 * * * *'
    workflow_dispatch:
    issues:
        types: [edited]
    pull_request:
        types: [edited]

permissions:
    contents: read

concurrency:
    group: renovate
    cancel-in-progress: false

jobs:
    renovate:
        # Only the repository owner's checkbox edits start an immediate run.
        if: >-
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch' ||
            (github.actor == github.repository_owner &&
            github.event.changes.body &&
            ((github.event_name == 'issues' && github.event.issue.title == 'Dependency Dashboard') ||
            (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'renovate/'))))
        runs-on: ubuntu-latest
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false
            - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
              id: app
              with:
                  client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write
                  permission-statuses: write
                  permission-vulnerability-alerts: read
                  permission-workflows: write
            - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
              with:
                  toolchain: nightly-2026-11-23
            - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
              with:
                  node-version-file: .node-version
                  install: false
            - name: Prepare Cargo path patch for Renovate clones
              run: |
                  node crates/cache-audit/scripts/prepare.mjs
                  # Cargo config overrides the manifest's clone-relative path.
                  # Share the trusted, patched checkout without enabling lifecycle scripts.
                  mkdir -p "$HOME/.cargo"
                  printf '\n[patch."https://github.com/voidzero-dev/vite-task"]\nfspy = { path = "%s/.pnpm/cache-audit-fspy/crates/fspy" }\n' \
                    "$GITHUB_WORKSPACE" >> "$HOME/.cargo/config.toml"
            - name: Run Renovate
              env:
                  RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
                  RENOVATE_CONFIG_FILE: ${{ github.workspace }}/.github/renovate-config.ts
                  LOG_LEVEL: debug
              run: pnpm dlx renovate@44.257.9
