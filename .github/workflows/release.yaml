name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    id-token: write

jobs:
    release:
        name: Create pnpm releases
        runs-on: ubuntu-latest
        outputs:
            plugin-released: ${{ steps.release.outputs.plugin-released }}
            plugin-tag: ${{ steps.release.outputs.plugin-tag }}
            native-released: ${{ steps.release.outputs.native-released }}
            native-tag: ${{ steps.release.outputs.native-tag }}
            engine-released: ${{ steps.release.outputs.engine-released }}
            browser-released: ${{ steps.release.outputs.browser-released }}
            browser-tag: ${{ steps.release.outputs.browser-tag }}
            any-released: ${{ steps.release.outputs.any-released }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: Tag reviewed version changes and create GitHub releases
              id: release
              run: node scripts/release.mjs publish "$BASE_SHA"
              env:
                  BASE_SHA: ${{ github.event.before }}
                  GH_TOKEN: ${{ github.token }}

    build-native:
        name: Build native binaries
        needs: [release]
        if: needs.release.outputs.native-released == 'true'
        uses: ./.github/workflows/build-native.yaml

    publish-native:
        name: Publish @atlowchemi/webfont-generator
        needs: [release, build-native]
        if: needs.release.outputs.native-released == 'true'
        runs-on: ubuntu-latest
        environment:
            name: npm
            url: https://www.npmjs.com/package/@atlowchemi/webfont-generator
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: nightly-2026-08-02
            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: .node-version
                  require-lockfile: true
                  cache: true

            - name: Download all binding artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: packages/webfont-generator/artifacts
                  pattern: bindings-*

            - name: Create npm dirs
              run: pnpm exec napi create-npm-dirs --cwd packages/webfont-generator
            - name: Move artifacts
              run: pnpm exec napi artifacts --cwd packages/webfont-generator

            # Prepare per-platform package.jsons (version bump, addon copy,
            # main package's optionalDependencies entries) before staging,
            # so the per-platform dirs are publish-ready. `prepublishOnly`
            # would normally do this when the main package is published —
            # we skip it via `--ignore-scripts` on the main stage step
            # below so this work isn't duplicated.
            - name: Prepare per-platform packages
              run: pnpm exec napi pre-publish -t npm --no-gh-release --skip-optional-publish --cwd packages/webfont-generator

            - name: List packages
              id: list-packages
              shell: bash
              run: |
                  ls -R ./packages/webfont-generator/npm
                  {
                      echo "dirs<<EOF"
                      find packages/webfont-generator/npm -mindepth 1 -maxdepth 1 -type d
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            # Per-platform packages stage *first* so the main package's
            # optionalDependencies entries are already in the staging area
            # by the time the main package is approved and promoted. Stage
            # ids land in the workflow run summary for the maintainer to
            # approve from a 2FA-enrolled machine.
            - name: Stage publish per-platform binary packages
              shell: bash
              env:
                  DIRS: ${{ steps.list-packages.outputs.dirs }}
              run: |
                  logs=$(mktemp -d)
                  trap 'rm -rf "$logs"' EXIT
                  pids=()
                  echo '## Staged: per-platform binary packages' >> "$GITHUB_STEP_SUMMARY"
                  echo '' >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  while IFS= read -r dir; do
                      [ -z "$dir" ] && continue
                      pkg=$(basename "$dir")
                      (
                          echo "--- $pkg ---"
                          pnpm stage publish "$dir" --no-git-checks
                      ) > "$logs/$pkg.log" 2>&1 &
                      pids+=("$!")
                  done <<< "$DIRS"
                  status=0
                  for pid in "${pids[@]}"; do
                      wait "$pid" || status=1
                  done
                  cat "$logs/"*.log | tee -a "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  exit "$status"

            - name: Stage publish main package
              run: |
                  echo '' >> "$GITHUB_STEP_SUMMARY"
                  echo '## Staged: @atlowchemi/webfont-generator' >> "$GITHUB_STEP_SUMMARY"
                  echo '' >> "$GITHUB_STEP_SUMMARY"
                  echo 'Approve every entry above + this one with `pnpm stage approve <id> --otp <code>` from a 2FA-enrolled maintainer machine.' >> "$GITHUB_STEP_SUMMARY"
                  echo '' >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  pnpm stage publish --filter @atlowchemi/webfont-generator --no-git-checks --ignore-scripts | tee -a "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

            - name: Upload to native release
              if: needs.release.outputs.native-released == 'true'
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  tag_name: ${{ needs.release.outputs.native-tag }}
                  files: packages/webfont-generator/**/*.node

    publish-crate:
        name: Publish to crates.io
        needs: [release]
        if: needs.release.outputs.engine-released == 'true'
        runs-on: ubuntu-latest
        environment:
            name: crates-io
            url: https://crates.io/crates/webfont-generator
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: nightly-2026-08-02
            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: .node-version
                  require-lockfile: true
                  cache: true
            - name: Authenticate with crates.io
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
              id: crates-auth
            - name: Publish to crates.io
              run: cargo publish --locked --registry crates-io -p webfont-generator
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

    publish-plugin:
        name: Publish vite-svg-2-webfont
        # The publish task packages the plugin without building or consuming native bindings.
        needs: [release]
        if: needs.release.outputs.plugin-released == 'true'
        runs-on: ubuntu-latest
        environment:
            name: npm
            url: https://www.npmjs.com/package/vite-svg-2-webfont
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: nightly-2026-08-02
            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: .node-version
                  require-lockfile: true
                  cache: true

            - name: Stage publish from tarball
              run: |
                  echo '## Staged: vite-svg-2-webfont' >> "$GITHUB_STEP_SUMMARY"
                  echo '' >> "$GITHUB_STEP_SUMMARY"
                  echo 'Approve with `pnpm stage approve <id> --otp <code>` from a 2FA-enrolled maintainer machine.' >> "$GITHUB_STEP_SUMMARY"
                  echo '' >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  pnpm pipeline plugin-publish --full | tee -a "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

            - name: Upload release assets
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  tag_name: ${{ needs.release.outputs.plugin-tag }}
                  files: packages/vite-svg-2-webfont/*.tgz

    publish-browser:
        name: Publish @atlowchemi/webfont-browser-generator
        needs: [release]
        if: needs.release.outputs.browser-released == 'true'
        runs-on: ubuntu-latest
        environment:
            name: npm
            url: https://www.npmjs.com/package/@atlowchemi/webfont-browser-generator
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: wasm32-unknown-unknown
                  toolchain: nightly-2026-08-02
            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: .node-version
                  require-lockfile: true
                  cache: true
            - uses: ./.github/actions/pipeline-cache
            - name: Stage publish from tarball
              run: |
                  echo '## Staged: @atlowchemi/webfont-browser-generator' >> "$GITHUB_STEP_SUMMARY"
                  echo 'Approve with `pnpm stage approve <id> --otp <code>` from a 2FA-enrolled maintainer machine.' >> "$GITHUB_STEP_SUMMARY"
                  pnpm pipeline browser-publish --full | tee -a "$GITHUB_STEP_SUMMARY"
            - name: Upload release assets
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  tag_name: ${{ needs.release.outputs.browser-tag }}
                  files: packages/webfont-browser/*.tgz

    deploy-docs:
        name: Deploy docs
        needs: [release]
        if: needs.release.outputs.any-released == 'true'
        uses: ./.github/workflows/docs.yaml
        permissions:
            contents: read
