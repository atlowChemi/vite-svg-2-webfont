name: Docs

on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        name: build docs
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: setup pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
              with:
                  node-version-file: .node-version
                  run-install: true
                  cache: true
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: target/wasm-bindgen-tools
                  key: wasm-bindgen-${{ runner.os }}-${{ hashFiles('packages/webfont-browser/Cargo.toml') }}
            - name: Cache docs fonts
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: packages/docs/.vitepress/cache/vite-svg-2-webfont
                  # The plugin and engine validate entries; restore the latest cache across commits.
                  key: docs-fonts-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
                  restore-keys: docs-fonts-v1-${{ runner.os }}-${{ runner.arch }}-
            - name: build docs
              run: vp run @atlowchemi/vite-svg-webfont-docs#build
            - name: upload pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: packages/docs/.vitepress/dist

    deploy:
        name: deploy docs
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: deploy to github pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
