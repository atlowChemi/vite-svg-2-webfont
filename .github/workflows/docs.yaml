name: Docs

on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docs-production
    cancel-in-progress: true

jobs:
    build:
        name: build docs
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
              with:
                  targets: wasm32-unknown-unknown
                  components: clippy, rustfmt
                  toolchain: nightly-2026-11-23
            - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
              with:
                  node-version-file: .node-version
                  require-lockfile: true
                  cache: true
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: target/wasm-bindgen-tools
                  key: wasm-bindgen-${{ runner.os }}-${{ hashFiles('packages/webfont-browser/Cargo.toml') }}
            - name: Cache docs fonts, code blocks and diagrams
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      packages/docs/.cache/vite-svg-2-webfont
                      packages/docs/.cache/render
                  # The plugin and engine validate font entries, and render entries are keyed by everything that decides
                  # them; restore the latest cache across commits.
                  key: docs-fonts-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
                  restore-keys: docs-fonts-v2-${{ runner.os }}-${{ runner.arch }}-
            # The build renders Mermaid diagrams in headless Chromium, unless the cache already has them.
            - name: install Chromium for diagrams
              working-directory: packages/docs
              run: pnpm exec playwright install --with-deps --only-shell chromium
            - uses: ./.github/actions/pipeline-cache
            - name: build docs
              run: pnpm pipeline docs --full
            - name: upload docs artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: docs-production
                  path: packages/docs/dist
                  if-no-files-found: error

    deploy:
        name: deploy docs
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: fonte-production
            url: https://fonte.atlow.dev
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: docs-production
                  path: packages/docs/dist
            - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
              with:
                  node-version-file: .node-version
                  install: false
                  cache: false
            - name: Deploy production Worker
              working-directory: packages/docs
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  WRANGLER_SEND_METRICS: 'false'
                  SHA: ${{ github.sha }}
              run: pnpm dlx wrangler@4.151.0 deploy --config wrangler.production.jsonc --message "release at ${SHA:0:7}"
