name: Build Native Binaries

on:
    workflow_call:
        inputs:
            scope:
                description: Native build scope (full or linux-x64)
                type: string
                default: full
    workflow_dispatch:

env:
    DEBUG: 'napi:*'
    MACOSX_DEPLOYMENT_TARGET: '10.13'
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: read

jobs:
    build:
        name: Build ${{ matrix.target }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: >-
                    ${{ fromJSON(inputs.scope == 'linux-x64'
                        && '["x86_64-unknown-linux-gnu"]'
                        || '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","armv7-unknown-linux-gnueabihf","x86_64-apple-darwin","aarch64-apple-darwin","x86_64-pc-windows-msvc","aarch64-pc-windows-msvc"]') }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              id: rust
              with:
                  targets: ${{ matrix.target }}
            - name: Cache build artifacts
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: target
                  key: rust-v3-native-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.github/workflows/build-native.yaml') }}
                  restore-keys: rust-v3-native-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-

            - name: Restore xwin SDK/CRT cache
              id: xwin-cache-restore
              if: contains(matrix.target, 'windows-msvc')
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ github.workspace }}/.xwin
                  key: xwin-${{ runner.os }}-windows-msvc-v1
                  restore-keys: |
                      xwin-${{ runner.os }}-windows-msvc-
                      xwin-${{ runner.os }}-

            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version-file: .node-version
                  run-install: true
                  cache: true

            - name: Install ziglang
              if: matrix.target != 'x86_64-unknown-linux-gnu' && !contains(matrix.target, 'windows-msvc')
              uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              with:
                  version: 0.14.1

            - name: Install cargo-zigbuild
              if: matrix.target != 'x86_64-unknown-linux-gnu' && !contains(matrix.target, 'windows-msvc')
              uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  tool: cargo-zigbuild

            - name: Install LLVM 20 tools (MSVC targets)
              if: contains(matrix.target, 'windows-msvc')
              run: |
                  wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
                  echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
                  sudo apt-get update && sudo apt-get install -y llvm-20 clang-20 lld-20
                  sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
                  sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
                  sudo update-alternatives --install /usr/bin/clang-cl clang-cl /usr/bin/clang-cl-20 100
                  sudo update-alternatives --install /usr/bin/llvm-lib llvm-lib /usr/bin/llvm-lib-20 100
                  sudo update-alternatives --install /usr/bin/lld-link lld-link /usr/bin/lld-link-20 100

            - name: Install cargo-xwin
              if: contains(matrix.target, 'windows-msvc')
              uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  tool: cargo-xwin

            - name: Pre-download xwin artifacts
              if: contains(matrix.target, 'windows-msvc')
              run: cargo xwin cache xwin
              env:
                  XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin

            - name: Save xwin SDK/CRT cache
              if: contains(matrix.target, 'windows-msvc') && success() && steps.xwin-cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ github.workspace }}/.xwin
                  key: xwin-${{ runner.os }}-windows-msvc-v1

            - name: Build native module
              working-directory: packages/webfont-generator
              run: >
                  vp exec napi build --release --platform --esm --js binding.js --dts binding.d.ts
                  ${{ matrix.target != 'x86_64-unknown-linux-gnu' && format('--target {0} -x', matrix.target) || '' }}
                  -- --locked
              env:
                  XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin
                  CFLAGS_x86_64_apple_darwin: -mmacosx-version-min=10.13
                  CXXFLAGS_x86_64_apple_darwin: -mmacosx-version-min=10.13
                  CFLAGS_aarch64_apple_darwin: -mmacosx-version-min=11.0
                  CXXFLAGS_aarch64_apple_darwin: -mmacosx-version-min=11.0

            - name: Record binding provenance
              working-directory: packages/webfont-generator
              env:
                  BINDING_TARGET: ${{ matrix.target }}
              run: |
                  node --input-type=module <<'NODE'
                  import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
                  import { createHash } from 'node:crypto';
                  import { execFileSync } from 'node:child_process';
                  const files = readdirSync('.').filter(file => file.endsWith('.node'));
                  if (files.length !== 1) throw new Error(`Expected one release binding, found ${files.length}`);
                  const filename = files[0];
                  writeFileSync('binding-build.json', JSON.stringify({
                      target: process.env.BINDING_TARGET,
                      filename,
                      sha256: createHash('sha256').update(readFileSync(filename)).digest('hex'),
                      rust: execFileSync('rustc', ['--version'], { encoding: 'utf8' }).trim(),
                      revision: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
                  }, null, 2));
                  NODE

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: bindings-${{ matrix.target }}
                  path: |
                      packages/webfont-generator/*.node
                      packages/webfont-generator/binding-build.json
                  if-no-files-found: error
