name: Install workspace dependencies
description: Restore the pnpm JS/crate store, materialize sources, and validate Cargo's lockfile.
inputs:
    args:
        description: Additional vp install arguments
        default: --frozen-lockfile
runs:
    using: composite
    steps:
        - name: Locate dependency store
          id: store
          shell: bash
          run: |
              echo "path=$(vp exec pnpm store path)" >> "$GITHUB_OUTPUT"
              VERSION=$(node -p "require('./package.json').packageManager.split('+')[0]")
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ${{ steps.store.outputs.path }}
              key: deps-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.store.outputs.version }}-${{ hashFiles('package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'Cargo.lock') }}
              restore-keys: deps-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.store.outputs.version }}-
        - name: Install dependencies
          shell: bash
          env:
              INSTALL_ARGS: ${{ inputs.args }}
          run: vp install $INSTALL_ARGS
        - name: Validate Cargo lockfile
          shell: bash
          run: cargo metadata --locked --offline --all-features --format-version 1 > /dev/null
