name: Upload executed test results
description: Archive JUnit and upload it to Codecov without reusing cached execution results.
inputs:
    name:
        description: Suite and matrix identity
        required: true
    files:
        description: JUnit report glob
        required: true
    token:
        description: Codecov token
        required: true
runs:
    using: composite
    steps:
        - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
              name: test-results-${{ inputs.name }}-${{ github.run_attempt }}
              path: ${{ inputs.files }}
              if-no-files-found: error
        - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
          with:
              report_type: test_results
              disable_search: true
              files: ${{ inputs.files }}
              name: ${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
              flags: ${{ inputs.name }}
              override_build_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
              fail_ci_if_error: true
              token: ${{ inputs.token }}
