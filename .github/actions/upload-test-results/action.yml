name: Upload executed test results
description: Upload JUnit to Codecov; callers archive reports separately.
inputs:
    name:
        description: Suite and matrix identity
        required: true
    files:
        description: JUnit report glob
        required: true
    token:
        description: Codecov token
        required: true
runs:
    using: composite
    steps:
        - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
          with:
              # Keep CLI downloads isolated and use checkout's existing git configuration.
              cleanup: true
              disable_safe_directory: true
              report_type: test_results
              disable_search: true
              files: ${{ inputs.files }}
              name: ${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
              flags: ${{ inputs.name }}
              override_build_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
              fail_ci_if_error: true
              token: ${{ inputs.token }}
