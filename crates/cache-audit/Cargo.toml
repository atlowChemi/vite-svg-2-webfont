[package]
name = "cache-audit"
version = "0.0.0"
edition = "2024"
publish = false

# fspy's artifact dependencies need nightly; keep the product workspace on stable.
[workspace]
exclude = ["target"]

[dependencies]
fspy = { git = "https://github.com/voidzero-dev/vite-task", rev = "8db455ef9c2b1c7b33cf70d8ba370c1f2c49d4c9" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
wax = "=0.7.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time"] }
tokio-util = "0.7"
tempfile = "3"
nix = { version = "0.31", features = ["signal", "process"] }
indexmap = "2.14"
pnpm-catalogs-config = { git = "https://github.com/pnpm/pnpm", rev = "fe4a0c232384289de82be3d502896ca7e070050c" }
pnpm-config = { git = "https://github.com/pnpm/pnpm", rev = "fe4a0c232384289de82be3d502896ca7e070050c" }
pnpm-workspace = { git = "https://github.com/pnpm/pnpm", rev = "fe4a0c232384289de82be3d502896ca7e070050c" }
pnpm-workspace-projects-graph = { git = "https://github.com/pnpm/pnpm", rev = "fe4a0c232384289de82be3d502896ca7e070050c" }
pnpm-workspace-task-scheduler = { git = "https://github.com/pnpm/pnpm", rev = "fe4a0c232384289de82be3d502896ca7e070050c" }

# Match pnpm's semver fix; dependency workspaces do not inherit their patches.
[patch.crates-io]
node-semver = { git = "https://github.com/pnpm/node-semver-rs", rev = "3d74d6b7f4de1de2006cf2f7663aac09de65b1f6" }
