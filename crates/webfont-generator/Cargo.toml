[package]
name = "webfont-generator"
version = "0.12.0"
edition = "2024"
license = "MIT"
description = "Generate webfonts (SVG, TTF, EOT, WOFF, WOFF2) from SVG icons"
repository = "https://github.com/atlowChemi/vite-svg-2-webfont"
homepage = "https://fonte.atlow.dev/webfont-generator/rust"
documentation = "https://docs.rs/webfont-generator"
readme = "README.md"
keywords = ["webfont", "svg", "icon-font", "woff", "opentype"]
categories = ["command-line-utilities", "graphics", "web-programming"]

[[bin]]
name = "webfont-generator"
required-features = ["cli"]

[lints]
workspace = true

[features]
default = ["fs", "in_memory", "async"]
fs = ["async", "tokio/fs"]
in_memory = []
async = ["dep:tokio"]
cli = ["fs", "dep:clap", "dep:serde_path_to_error"]
bench = ["fs", "in_memory"]

[dependencies]
brotli = "=9.1.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
handlebars = "6.4.1"
kurbo = "0.13.1"
md5 = "0.8.0"
rayon = "1.12.0"
roxmltree = "0.21.1"
rustc-hash = { version = "2.1.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = { version = "0.1", optional = true }
oxvg_path = "0.0.9"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"], optional = true }
usvg = { version = "0.49.0", default-features = false }
write-fonts = { version = "0.55.0", features = ["read"] }

indexmap = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
woff = { version = "0.6.3" }

[[bench]]
name = "incremental"
harness = false
required-features = ["bench"]

[[test]]
name = "integration"
required-features = ["fs"]

[[test]]
name = "color"
required-features = ["fs"]

[[test]]
name = "variant_incremental"
required-features = ["fs"]

[[bench]]
name = "pipeline"
harness = false
required-features = ["bench"]

[[bench]]
name = "features"
harness = false
required-features = ["bench"]

[[bench]]
name = "variants"
harness = false
required-features = ["bench"]

[[bench]]
name = "typescript"
harness = false
required-features = ["bench"]
