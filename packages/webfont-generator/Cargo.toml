[package]
name = "webfont-generator-napi"
version = "0.9.0"
edition = "2024"
publish = false
license = "MIT"
description = "Node.js adapter for the webfont-generator Rust engine"

[lib]
path = "native/lib.rs"
crate-type = ["cdylib"]

[dependencies]
webfont-generator = { path = "../../crates/webfont-generator", version = "0.9.0" }
napi = { version = "3.11.0", default-features = false, features = ["napi4", "async", "serde-json-ordered"] }
napi-derive = "3.5.6"
serde_json = "1.0.150"

[build-dependencies]
napi-build = "2.3.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
