packages:
    - 'packages/*'
    - 'crates/*'

includeWorkspaceRoot: true
include:
    ./pnpm-tasks.yaml: [tasks, pipelines]

allowBuilds:
    '@parcel/watcher': false
    esbuild: false
    ttf2woff2: false
catalog:
    '@vitest/browser-playwright': 5.1.0
    '@vitest/coverage-v8': 5.1.0
    oxc-minify: ^0.159.0
    typescript: ^7.0.2
    vite: 8.3.8
    vitest: 5.1.0

cargo:
    enabled: true

versioning:
    changelog:
        storage: repository
    # The engine's npm manifest is only a task shim. Its Cargo release follows
    # @atlowchemi/webfont-generator through scripts/release.mjs.
    ignore:
        - './'
        - './crates/cache-audit'
        - './crates/webfont-generator'
        - './packages/docs'
        - './packages/example'

# CI and developers install Rust components/targets with rustup. Do not shadow
# that toolchain with pnpm's separately downloaded Rust runtime.
runtimeOnFail: error

overrides:
    # Standalone Oxc binaries must not resolve their optional Vite+ integration.
    'oxfmt>vite-plus': '-'
    'oxlint>vite-plus': '-'
    lodash@>=4.0.0 <=4.17.22: '^4.18.1'
    make-fetch-happen: 16.0.1
    minimatch@<3.1.4: '^10.0.0'
    underscore@<=1.13.7: '^1.13.8'
    'vitest@*': 'catalog:'
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
permissions:
    core-js-pure:
        build: false
    dtrace-provider:
        build: false
    protobufjs:
        build: false
    re2:
        build: false
    tsdown:
        skills: true
skills:
    dirs:
        - .agents/skills
        - .claude/skills
        - .cursor/skills
        - .github/skills
