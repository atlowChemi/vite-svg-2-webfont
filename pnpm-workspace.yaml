packages:
    - 'packages/*'
allowBuilds:
    '@parcel/watcher': false
    esbuild: false
    ttf2woff2: false
catalog:
    oxc-minify: ^0.147.0
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@0.3.0
    vite-plus: 0.3.0
    '@vitest/coverage-v8': 4.1.11

configDependencies:
    '@pnpm/pacquet': 0.11.12

overrides:
    lodash@>=4.0.0 <=4.17.22: '^4.18.1'
    make-fetch-happen: 16.0.1
    minimatch@<3.1.4: '^10.0.0'
    underscore@<=1.13.7: '^1.13.8'
    vite: 'catalog:'
    vitepress>vite: ^8.0.0
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
        vitest: '*'
