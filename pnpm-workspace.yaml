packages:
    - 'packages/*'
    - 'crates/*'
allowBuilds:
    '@parcel/watcher': false
    esbuild: false
    ttf2woff2: false
catalog:
    '@vitest/browser-playwright': 5.0.1
    '@vitest/coverage-v8': 5.0.1
    oxc-minify: ^0.153.0
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.0.0
    vite-plus: 1.0.0
    vitest: 5.0.1

cargo:
    enabled: true

overrides:
    lodash@>=4.0.0 <=4.17.22: '^4.18.1'
    make-fetch-happen: 16.0.1
    minimatch@<3.1.4: '^10.0.0'
    underscore@<=1.13.7: '^1.13.8'
    'vitest@*': 'catalog:'
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
minimumReleaseAgeExclude:
    - '@oxc-minify/binding-darwin-x64@0.152.0'
    - '@oxc-minify/binding-freebsd-x64@0.152.0'
    - '@oxc-minify/binding-linux-x64-gnu@0.152.0'
    - '@oxc-minify/binding-linux-x64-musl@0.152.0'
    - '@oxc-minify/binding-win32-x64-msvc@0.152.0'
    - oxc-minify@0.152.0
