packages:
    - 'packages/*'
    - 'crates/*'

# Dormant migration entry points; normal development and CI still use vp run.
# Root-owned tasks cover workspace inputs that package-local ../../ globs cannot hash.
includeWorkspaceRoot: true
pipelines:
    next-native: [next:native]
    next-check: [next:fmt:rust, next:adapter:check, next:browser:check]
    next-test: [next:fmt:rust, next:adapter:test, next:browser:test, next:test:js]
    next-build: [next:plugin:pack, next:browser:pack]
    next-docs: [next:docs]
    next-example: [next:example]
    next-coverage: [next:coverage]
    next-assets: [next:docs:social]
tasks:
    next:pipeline: { cache: false, dependsOn: [] }
    next:verify: { cache: false, dependsOn: [] }
    # Package scripts are raw commands, not independently cacheable entry points.
    next:build: { cache: false, dependsOn: [] }
    next:pack: { cache: false, dependsOn: [] }
    next:check: { cache: false, dependsOn: [] }
    next:test: { cache: false, dependsOn: [] }
    next:test:features: { cache: false, dependsOn: [] }
    next:optimize-svg: { cache: false, dependsOn: [] }
    next:social-card: { cache: false, dependsOn: [] }

    # Formatting is a pipeline sibling, not a dependency that widens package check keys.
    next:fmt:rust:
        cache: false
        dependsOn: []
    # Result caching still awaits toolchain fingerprints and auditing.
    next:engine:check:
        cache: false
        dependsOn: []
    next:engine:features:
        cache: false
        env: [UPDATE_SVG_FIXTURES]
        dependsOn: [next:engine:check]
    next:engine:test:
        cache: false
        env: [UPDATE_SVG_FIXTURES]
        dependsOn: [next:engine:check, next:engine:features]
    next:adapter:check:
        cache: false
        dependsOn: [next:engine:check]
    next:adapter:test:
        cache: false
        env: [UPDATE_SVG_FIXTURES]
        dependsOn: [next:adapter:check, next:engine:test]

    # Candidate native coverage for the auditor. Enable result caching only after
    # automatic compiler/toolchain fingerprints and the blocking audit land.
    # Cargo's intermediate target directory is deliberately not a restored output.
    next:native:
        cache: false
        dependsOn: []
        inputs:
            - '**/.gitignore'
            - package.json
            - pnpm-workspace.yaml
            - pnpm-lock.yaml
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - rust-toolchain*
            - crates/webfont-generator/**
            - packages/webfont-browser/Cargo.toml
            - packages/webfont-browser/README.md
            - packages/webfont-browser/**/*.rs
            - packages/*/package.json
            - crates/*/package.json
            # Optional configuration/loader probes must affect the key if created.
            - .npmrc
            - .pnp.cjs
            - .pnpmfile.*
            - package.{json5,yaml}
            - libgcc_s.so.1
            - packages/.cargo/**
            - packages/{Cargo.toml,HEAD,pnpm-workspace.yaml,rust-toolchain,rust-toolchain.toml}
            - pnpm11/pnpm/package.json
            # Cargo/NAPI inspect adapter assets and target-discovery files too.
            - packages/webfont-generator/**
        outputs:
            - packages/webfont-generator/binding.js
            - packages/webfont-generator/binding.d.ts
            - packages/webfont-generator/*.node
        env: [CACHE_TOOLCHAIN_FINGERPRINT, RUSTFLAGS, CARGO_ENCODED_RUSTFLAGS, CARGO_BUILD_TARGET, CARGO_TARGET_DIR, RUSTUP_TOOLCHAIN, CC, CXX]
    next:wasm:
        cache: false
        dependsOn: []
        inputs:
            - package.json
            - pnpm-workspace.yaml
            - pnpm-lock.yaml
            - Cargo.toml
            - Cargo.lock
            - .cargo/**
            - rust-toolchain*
            - crates/webfont-generator/**
            - packages/webfont-generator/Cargo.toml
            - packages/webfont-browser/package.json
            - packages/webfont-browser/Cargo.toml
            - packages/webfont-browser/native/**
            - packages/webfont-browser/scripts/**
            - packages/webfont-browser/{README.md,build.rs}
            - packages/webfont-browser/{src,tests}/**/*.rs
            - packages/webfont-generator/{README.md,build.rs}
            - packages/webfont-generator/{src,tests}/**/*.rs
            - '**/{package.json,pnpm-workspace.yaml,rust-toolchain,rust-toolchain.toml,.pnp.cjs}'
            - '{.npmrc,.pnpmfile.cjs,.pnpmfile.mjs,package.json5,package.yaml}'
        outputs: [packages/webfont-browser/generated/**]
        env: [CACHE_TOOLCHAIN_FINGERPRINT, RUSTFLAGS, CARGO_ENCODED_RUSTFLAGS, CARGO_TARGET_DIR, RUSTUP_TOOLCHAIN, WASM_BINDGEN]
    next:browser:pack:
        cache: false
        env: [CACHE_TOOLCHAIN_FINGERPRINT, NODE_ENV]
        dependsOn: [next:wasm]
        outputs: [packages/webfont-browser/dist/**]
    next:browser:check:
        cache: false
        dependsOn: [next:wasm]
    next:browser:test:
        cache: false
        dependsOn: [next:browser:check, next:browser:pack]
    next:plugin:pack:
        # May upload Codecov bundle analysis; retain execution until audited.
        cache: false
        env: [CACHE_TOOLCHAIN_FINGERPRINT, NODE_ENV, CODECOV_TOKEN, ALLOW_BUNDLE_ANALYSIS]
        dependsOn: [next:native]
        outputs: [packages/vite-svg-2-webfont/dist/**]
    next:plugin:test:
        cache: false
        dependsOn: [next:native]
    next:test:js:
        cache: false
        dependsOn: [next:native, next:browser:pack]
    next:coverage:
        cache: false
        dependsOn: [next:native]

    next:docs:svg:
        dependsOn: []
        env: [CACHE_TOOLCHAIN_FINGERPRINT]
        inputs:
            - scripts/next-pipeline.mjs
            - package.json
            - pnpm-workspace.yaml
            - pnpm-lock.yaml
            - packages/docs/package.json
            - packages/docs/assets/svg/**
            - packages/docs/svgo.config.*
            - '**/{package.json,pnpm-workspace.yaml,rust-toolchain,rust-toolchain.toml,.pnp.cjs}'
            - '{.npmrc,.pnpmfile.cjs,.pnpmfile.mjs,package.json5,package.yaml}'
            - '**/svgo.config.{js,cjs,mjs,ts}'
        outputs: [packages/docs/public/**/*.svg]
    next:docs:social:
        # Rendering may use host fonts; do not cache until that input is audited.
        cache: false
        dependsOn: [next:docs:svg]
        inputs:
            - package.json
            - pnpm-workspace.yaml
            - pnpm-lock.yaml
            - packages/docs/package.json
            - packages/docs/scripts/generate-social-card.ts
        outputs: [packages/docs/public/social-card.png]
    next:docs:
        cache: false
        env: [CACHE_TOOLCHAIN_FINGERPRINT, NODE_ENV, GITHUB_ACTIONS]
        dependsOn: [next:docs:social, next:plugin:pack, next:browser:pack]
        outputs: [packages/docs/.vitepress/dist/**, packages/docs/examples/write-files/generated/**]
    next:example:
        cache: false
        env: [CACHE_TOOLCHAIN_FINGERPRINT, CACHE_INPUT_EXAMPLE_ENV_LOCAL, CACHE_INPUT_EXAMPLE_ENV_PRODUCTION_LOCAL, NODE_ENV]
        dependsOn: [next:plugin:pack, next:docs:svg]
        outputs: [packages/example/dist/**]

allowBuilds:
    '@parcel/watcher': false
    esbuild: false
    ttf2woff2: false
catalog:
    '@vitest/browser-playwright': 5.0.5
    '@vitest/coverage-v8': 5.0.5
    oxc-minify: ^0.155.0
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.3.0
    vite-plus: 1.3.0
    vitest: 5.0.5

cargo:
    enabled: true

overrides:
    lodash@>=4.0.0 <=4.17.22: '^4.18.1'
    make-fetch-happen: 16.0.1
    minimatch@<3.1.4: '^10.0.0'
    underscore@<=1.13.7: '^1.13.8'
    'vitest@*': 'catalog:'
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: '*'
        vitest: '*'
minimumReleaseAgeExclude:
    - '@oxc-minify/binding-darwin-x64@0.152.0'
    - '@oxc-minify/binding-freebsd-x64@0.152.0'
    - '@oxc-minify/binding-linux-x64-gnu@0.152.0'
    - '@oxc-minify/binding-linux-x64-musl@0.152.0'
    - '@oxc-minify/binding-win32-x64-msvc@0.152.0'
    - oxc-minify@0.152.0
